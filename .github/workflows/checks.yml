name: checks

# Guardrail CI for a docs-only methodology repo: no build; the consistency
# checks that were previously done by hand, one regression test for the
# `scout` helper, and an enforcement of the repo's own "runtime: none /
# docs only" identity.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
        with:
          fetch-depth: 0   # full history: gitleaks (git mode) + tag<->changelog checks

      - name: helper script sanity (sh -n + shellcheck)
        run: |
          for s in scout flywheel-export; do
            sh -n "$s"
            shellcheck "$s"   # shellcheck is preinstalled on ubuntu runners
          done

      - name: scout regression (fixture + out-of-clone symlink)
        run: |
          # scout resolves symlinks before locating its clone. A link in
          # another directory - what `ln -s ~/tribunal/scout ~/.local/bin/scout`
          # makes - once printed nothing and exited 0 (fixed in v1.0.5). The
          # fixture stands in for core/templates/scout.md; expected.txt is the
          # body scout must emit from it (title and HTML comment stripped).
          # A same-directory link does NOT exercise the bug: dirname of the
          # link is still the clone.
          set -eu -o pipefail
          d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
          mkdir -p "$d/clone/core/templates" "$d/bin"
          cp scout "$d/clone/scout"
          cp test/scout/fixture.md "$d/clone/core/templates/scout.md"
          ln -s "$d/clone/scout" "$d/bin/scout"
          for entry in clone/scout bin/scout; do
            TRIBUNAL_NO_UPDATE_CHECK=1 sh "$d/$entry" > "$d/actual" 2> "$d/err" \
              || { echo "::error::scout regression: $entry exited $?"; cat "$d/err"; exit 1; }
            test -s "$d/actual" \
              || { echo "::error::scout regression: $entry printed nothing"; exit 1; }
            diff -u test/scout/expected.txt "$d/actual" \
              || { echo "::error::scout regression: $entry output differs from test/scout/expected.txt"; exit 1; }
          done
          echo "scout regression: OK"

      - name: flywheel-export regression (repeated template_delta lines)
        run: |
          # `template_delta` is the one repeatable retro field ("one concrete
          # proposed edit per line"). Before v1.1.9 the exporter read only the
          # LAST occurrence, so real deltas followed by a "no change" line
          # exported had_template_delta:false and the rest were discarded.
          # Fixture 1 (multi) must be true; fixture 2 (nochange) must stay false
          # - the second catches an over-correction that counts lines instead of
          # real deltas. This step FAILS on the pre-v1.1.9 exporter.
          set -eu -o pipefail
          d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
          mkdir -p "$d/multi" "$d/nochange"
          cp test/flywheel/retro-multi-delta.md "$d/multi/retro.md"
          cp test/flywheel/retro-nochange.md    "$d/nochange/retro.md"
          out=$(./flywheel-export "$d" 2>/dev/null)
          got_multi=$(printf '%s' "$out" | grep -c '"had_template_delta":true')
          got_none=$(printf '%s' "$out" | grep -c '"had_template_delta":false')
          [ "$got_multi" = 1 ] || { echo "::error::multi-delta fixture must export had_template_delta:true (got $got_multi)"; printf '%s\n' "$out"; exit 1; }
          [ "$got_none" = 1 ]  || { echo "::error::no-change fixture must export had_template_delta:false (got $got_none)"; printf '%s\n' "$out"; exit 1; }
          # stdout stays controlled metadata: no delta text may leak
          printf '%s' "$out" | grep -qi 'proposed edit' \
            && { echo "::error::delta text leaked into stdout"; exit 1; }
          echo "flywheel-export regression: OK"

      - name: docs-only guard (enforce runtime-none)
        run: |
          # The repo ships documentation + the single `scout` shell helper.
          # Fail if any tracked file is application/build code - that would
          # break the "A methodology, not a framework" promise.
          bad=$(git ls-files \
            | grep -E '\.(js|mjs|cjs|ts|tsx|jsx|py|rb|go|rs|java|php|sh)$|(^|/)(package\.json|package-lock\.json|yarn\.lock|requirements\.txt|Cargo\.toml|go\.mod|setup\.py|pyproject\.toml|Dockerfile)$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-docs files present - this repo is docs-only (the only scripts are 'scout' and 'flywheel-export'):"
            echo "$bad"
            exit 1
          fi
          echo "docs-only: OK"

      - name: internal links resolve
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          bad = []
          for md in pathlib.Path('.').rglob('*.md'):
              if '.git' in md.parts:
                  continue
              text = md.read_text(encoding='utf-8', errors='ignore')
              for m in re.finditer(r'\]\(([^)]+)\)', text):
                  link = m.group(1).strip().split()[0]  # drop any ("title")
                  if link.startswith(('http://', 'https://', 'mailto:', 'tel:', '#')):
                      continue
                  path = link.split('#', 1)[0]
                  if not path:
                      continue
                  if not (md.parent / path).resolve().exists():
                      bad.append(f"{md}: -> {link}")
          if bad:
              print("::error::Broken internal links:")
              print("\n".join(bad))
              sys.exit(1)
          print("internal links: OK")
          PY

      - name: secret / PII scan (gitleaks, pinned + checksummed, full history)
        run: |
          VERSION=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          # `git` mode scans every commit (a secret committed then removed still
          # fails); `dir` mode only scanned the checked-out tree.
          ./gitleaks git . --no-banner --redact --exit-code 1

      - name: release consistency (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${tag}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [${tag}]' section for tag ${GITHUB_REF_NAME}"; exit 1; }
          grep -q "^\[${tag}\]:" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md footer has no '[${tag}]:' compare link"; exit 1; }
          echo "release ${GITHUB_REF_NAME} <-> CHANGELOG: OK"
