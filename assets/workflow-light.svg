<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- Frozen brief -->
  <rect x="16" y="118" width="128" height="84" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="80" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">FROZEN</text>
  <text x="80" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">BRIEF</text>
  <text x="80" y="188" text-anchor="middle" font-size="10.5" fill="#57606a">immutable, every round</text>
  <text x="80" y="108" text-anchor="middle" font-size="9.5" font-style="italic" fill="#57606a">scout drafts it ↓</text>

  <!-- Round 0 label -->
  <text x="248" y="34" text-anchor="middle" font-size="11.5" font-weight="700" fill="#57606a" letter-spacing="1">ROUND 0 - ISOLATED, PARALLEL</text>

  <!-- Seat A -->
  <rect x="184" y="48" width="128" height="76" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="248" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">SEAT A</text>
  <text x="248" y="96" text-anchor="middle" font-size="10.5" fill="#0969da">frontier CLI · vendor 1</text>
  <text x="248" y="110" text-anchor="middle" font-size="10.5" fill="#57606a">claims + falsifiers</text>

  <!-- no cross-talk -->
  <line x1="248" y1="128" x2="248" y2="192" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="248" cy="160" r="11" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <text x="248" y="164.5" text-anchor="middle" font-size="12" font-weight="700" fill="#cf222e">✕</text>
  <text x="248" y="326" text-anchor="middle" font-size="10.5" fill="#57606a" font-style="italic">no cross-exposure - agreement after peeking is worthless</text>

  <!-- Seat B -->
  <rect x="184" y="196" width="128" height="76" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="248" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#cf222e">SEAT B</text>
  <text x="248" y="244" text-anchor="middle" font-size="10.5" fill="#cf222e">frontier CLI · vendor 2</text>
  <text x="248" y="258" text-anchor="middle" font-size="10.5" fill="#57606a">claims + falsifiers</text>

  <!-- Ledger -->
  <rect x="368" y="112" width="140" height="96" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="438" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6700">CLAIM LEDGER</text>
  <text x="438" y="158" text-anchor="middle" font-size="10.5" fill="#57606a">provenance-tagged</text>
  <text x="438" y="172" text-anchor="middle" font-size="10.5" fill="#57606a">agree pre-exposure?</text>
  <text x="438" y="186" text-anchor="middle" font-size="10.5" fill="#57606a">→ else: disputed only</text>

  <!-- Cross-exam -->
  <rect x="564" y="70" width="150" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="639" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">ROUND 1</text>
  <text x="639" y="112" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">CROSS-EXAM</text>
  <text x="639" y="131" text-anchor="middle" font-size="10.5" fill="#57606a">attack · concede · revise</text>
  <text x="639" y="145" text-anchor="middle" font-size="10.5" fill="#57606a">verbatim relay only</text>
  <text x="639" y="62" text-anchor="middle" font-size="9.5" font-style="italic" fill="#57606a">+ Round 2 if a load-bearing claim flips (rare)</text>

  <!-- Oracles -->
  <rect x="564" y="184" width="150" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="639" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">ORACLES</text>
  <text x="639" y="228" text-anchor="middle" font-size="10.5" fill="#57606a">tests · compilers · docs</text>
  <text x="639" y="242" text-anchor="middle" font-size="10.5" fill="#57606a">settle the checkable</text>

  <!-- Verdict -->
  <rect x="788" y="96" width="156" height="128" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="866" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">VERDICT</text>
  <text x="866" y="146" text-anchor="middle" font-size="10.5" fill="#116329">1 · independent agreement</text>
  <text x="866" y="163" text-anchor="middle" font-size="10.5" fill="#116329">2 · resolved after R0</text>
  <text x="866" y="180" text-anchor="middle" font-size="10.5" fill="#116329">3 · surviving dissent</text>
  <text x="866" y="203" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a7f37">dissent is reported,</text>
  <text x="866" y="217" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a7f37">never averaged away</text>

  <!-- arrows -->
  <path d="M144,144 L178,96" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M144,176 L178,224" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M312,92 L362,138" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M312,228 L362,182" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M508,140 L558,116" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M508,180 L558,208" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M714,113 L782,140" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M714,219 L782,186" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- flywheel: verdict -> retro -> brief -->
  <path d="M866,224 L866,286 Q866,300 852,300 L94,300 Q80,300 80,286 L80,208" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrg)"/>
  <rect x="404" y="284" width="152" height="32" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="480" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7f37">RETRO - did it hold?</text>
  <text x="480" y="311" text-anchor="middle" font-size="10" fill="#116329">template delta → next brief</text>
</svg>
