<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Frozen brief -->
  <rect x="16" y="118" width="128" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="80" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">FROZEN</text>
  <text x="80" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">BRIEF</text>
  <text x="80" y="188" text-anchor="middle" font-size="10.5" fill="#8b949e">immutable, every round</text>
  <text x="80" y="108" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8b949e">scout drafts it ↓</text>

  <!-- Round 0 label -->
  <text x="248" y="34" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8b949e" letter-spacing="1">ROUND 0 - ISOLATED, PARALLEL</text>

  <!-- Seat A -->
  <rect x="184" y="44" width="128" height="50" rx="10" fill="#0d1f33" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="248" y="68" text-anchor="middle" font-size="13.5" font-weight="700" fill="#58a6ff">SEAT A</text>
  <text x="248" y="85" text-anchor="middle" font-size="10.5" fill="#58a6ff">frontier CLI · vendor 1</text>

  <!-- Seat B -->
  <rect x="184" y="116" width="128" height="50" rx="10" fill="#2d1214" stroke="#f85149" stroke-width="1.5"/>
  <text x="248" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f85149">SEAT B</text>
  <text x="248" y="157" text-anchor="middle" font-size="10.5" fill="#f85149">frontier CLI · vendor 2</text>

  <!-- Seat C (optional third seat - dashed - for the highest-stakes calls) -->
  <rect x="184" y="188" width="128" height="50" rx="10" fill="#1c1726" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="248" y="209" text-anchor="middle" font-size="13.5" font-weight="700" fill="#bc8cff">SEAT C</text>
  <text x="248" y="226" text-anchor="middle" font-size="10" fill="#bc8cff">optional · vendor 3</text>

  <!-- no cross-exposure between any pair -->
  <circle cx="248" cy="105" r="8" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="248" y="109.5" text-anchor="middle" font-size="11" font-weight="700" fill="#f85149">✕</text>
  <circle cx="248" cy="177" r="8" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="248" y="181.5" text-anchor="middle" font-size="11" font-weight="700" fill="#f85149">✕</text>
  <text x="248" y="326" text-anchor="middle" font-size="10.5" fill="#8b949e" font-style="italic">no cross-exposure between any seat - agreement after peeking is worthless</text>

  <!-- Ledger -->
  <rect x="368" y="112" width="140" height="96" rx="10" fill="#2a2312" stroke="#d29922" stroke-width="1.5"/>
  <text x="438" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#d29922">CLAIM LEDGER</text>
  <text x="438" y="158" text-anchor="middle" font-size="10.5" fill="#8b949e">provenance-tagged</text>
  <text x="438" y="172" text-anchor="middle" font-size="10.5" fill="#8b949e">agree pre-exposure?</text>
  <text x="438" y="186" text-anchor="middle" font-size="10.5" fill="#8b949e">→ else: disputed only</text>

  <!-- Cross-exam -->
  <rect x="564" y="70" width="150" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="639" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">ROUND 1</text>
  <text x="639" y="112" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">CROSS-EXAM</text>
  <text x="639" y="131" text-anchor="middle" font-size="10.5" fill="#8b949e">attack · concede · revise</text>
  <text x="639" y="145" text-anchor="middle" font-size="10.5" fill="#8b949e">verbatim relay only</text>
  <text x="639" y="62" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8b949e">+ Round 2 if a load-bearing claim flips (rare)</text>

  <!-- Oracles -->
  <rect x="564" y="184" width="150" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="639" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">ORACLES</text>
  <text x="639" y="228" text-anchor="middle" font-size="10.5" fill="#8b949e">tests · compilers · docs</text>
  <text x="639" y="242" text-anchor="middle" font-size="10.5" fill="#8b949e">settle the checkable</text>

  <!-- Verdict -->
  <rect x="788" y="96" width="156" height="128" rx="10" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
  <text x="866" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb950">VERDICT</text>
  <text x="866" y="146" text-anchor="middle" font-size="10.5" fill="#7ee2a8">1 · independent agreement</text>
  <text x="866" y="163" text-anchor="middle" font-size="10.5" fill="#7ee2a8">2 · resolved after R0</text>
  <text x="866" y="180" text-anchor="middle" font-size="10.5" fill="#7ee2a8">3 · surviving dissent</text>
  <text x="866" y="203" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3fb950">dissent is reported,</text>
  <text x="866" y="217" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3fb950">never averaged away</text>

  <!-- arrows -->
  <path d="M144,138 L180,72" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M144,160 L180,141" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M144,182 L180,210" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M312,72 L362,132" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M312,141 L362,158" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M312,210 L362,186" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M508,140 L558,116" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M508,180 L558,208" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M714,113 L782,140" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M714,219 L782,186" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- flywheel: verdict -> retro -> brief -->
  <path d="M866,224 L866,286 Q866,300 852,300 L94,300 Q80,300 80,286 L80,208" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrg)"/>
  <rect x="404" y="284" width="152" height="32" rx="8" fill="#12261e" stroke="#3fb950" stroke-width="1.2"/>
  <text x="480" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#3fb950">RETRO - did it hold?</text>
  <text x="480" y="311" text-anchor="middle" font-size="10" fill="#7ee2a8">template delta → next brief</text>
</svg>
